# Optional Render Blueprint. Render -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: studyverse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: MONGO_URI        # paste your Atlas connection string in the dashboard
        sync: false
      - key: JWT_SECRET       # paste a long random value in the dashboard
        sync: false
      - key: CLIENT_URL       # your Vercel URL, e.g. https://my-app.vercel.app
        sync: false
